name: 🦞 构建川叶视频APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk git autoconf libtool cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: 📦 安装 Buildozer
        run: |
          pip install buildozer cython==0.29.37

      - name: 🔨 构建 APK
        run: |
          buildozer android debug

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 川叶视频模块-APK
          path: bin/*.apk
