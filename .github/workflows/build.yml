name: Build-Chuanye-Video-APK

on:
  push:
分支: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk git autoconf libtool cmake
          sudo apt install -y libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.37

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuanye-video-apk
          path: bin/*.apk
